[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rota-economica"
version = "0.1.2"
description = "Rota Econômica: custo de uma viagem de caminhão e onde abastecer para gastar menos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pandas>=2.0", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3", "duckdb>=1.0"]

[project.scripts]
rota-coleta = "rota_economica.__main__:main"
rota-camadas = "rota_economica.camadas.job:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
