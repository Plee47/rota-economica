name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualidade:
    name: Guardião, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Guardião de dados
        run: python -m rota_economica.guardiao
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest -q
