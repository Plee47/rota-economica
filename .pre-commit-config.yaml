repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        # Os agregados do site chegam a ~1 MB; o guardião limita a 5 MB e só em dados/site/.
        args: ["--maxkb=2000"]
  - repo: local
    hooks:
      - id: guardiao-dados
        name: Guardião de dados (nada de dado bruto no Git)
        entry: python src/rota_economica/guardiao.py
        language: system
        pass_filenames: false
        always_run: true
